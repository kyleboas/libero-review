[data-theme=dark] .lf-logo:before{background:#fff}
[data-theme=dark] :is(.spl-word,.hm-word){color:#fff}
.splash{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px 16px}
.spl-logo{width:132px;height:132px;animation:lfin .6s ease-out both}
.spl-word,.hm-word{font-size:30px;font-weight:700;letter-spacing:-.8px;color:#000;margin:0}
.spl-bar{width:min(320px,80vw);height:6px;border-radius:3px;background:var(--track);overflow:hidden;margin-top:10px}
.spl-bar i{display:block;height:100%;width:0;background:var(--link);border-radius:3px;transition:width .25s linear}
.spl-bar.err i{background:var(--bad)}
.spl-bar.busy i{width:35%;animation:lfbusy 1.3s ease-in-out infinite}
.spl-t{font-size:13px;color:var(--dim);min-height:1.3em;text-align:center}.spl-pct{color:var(--acc);font-variant-numeric:tabular-nums;display:inline-block;min-width:2.6em;text-align:right}
.spl-q{font-size:14px;font-style:italic;color:var(--fg2);min-height:2.6em;max-width:min(420px,90vw);text-align:center}.spl-q.in{animation:qin .4s ease-out}
@keyframes qin{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes lfin{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
@keyframes lfbusy{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}
@media(prefers-reduced-motion:reduce){.spl-logo,.spl-bar.busy i,.spl-q.in{animation:none}.spl-bar i{transition:none}}
.home{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 16px 28px;gap:10px;text-align:center}
.hm-logo{width:112px;height:112px}
.home .hm-word{font-size:56px;letter-spacing:-1.5px}
.hm-menu{display:flex;flex-direction:column;align-items:center;gap:4px;margin-top:28px}

.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ev)}

.drm3.drm2{grid-template-columns:repeat(2,minmax(0,1fr))!important}@media(max-width:800px){.drm3.drm2{grid-template-columns:minmax(0,1fr)!important}}  /* cohesion and the captain: no squad-mood chart *//* thoughts on hover cards and the board page: each with its weight, never an overall mood */
.hc-th{padding:4px 12px 10px;border-top:1px solid var(--line);font-size:12.5px}.hc-th>span{display:block;font-size:11px;color:var(--dim);margin:4px 0 2px}
.hc-th div,.bd-mind div{display:flex;gap:8px;padding:1px 0}.hc-th i,.bd-mind i{font-style:normal;min-width:34px;text-align:right}
.bd-mind{text-align:left;font-size:13px;margin:0 0 10px;min-width:240px}.bd-mind>.dim:first-child{font-size:11px;margin-bottom:3px}
/* a brief's candidates side by side *//* the You page (app.js youPage) */
.youg{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;align-items:start}

.mny{display:flex;flex-direction:column;gap:12px}.mny-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.mny .chart{background:transparent}.mny-t{border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:12px;display:flex;flex-direction:column;gap:2px}.mny-v{font-size:22px;font-weight:400;font-variant-numeric:tabular-nums;color:var(--fg)}.mny-v.good{color:var(--good)}.mny-v.bad{color:var(--bad)}
.mny-sec{display:flex;flex-direction:column;gap:5px;font-size:13px}.mny-sec>.dim:first-child{font-size:12px}
.mny-stack{display:flex;gap:2px;height:14px}.mny-stack i{display:block;min-width:3px;border-radius:2px}.mny-stack i:first-child{border-radius:4px 2px 2px 4px}.mny-stack i:last-child{border-radius:2px 4px 4px 2px}
.mny-l{display:grid;grid-template-columns:52px minmax(0,1fr) 70px 64px;gap:8px;align-items:center;font-size:12px;padding:2px 0;font-variant-numeric:tabular-nums}.mny-l>span:last-child{text-align:right}
.mny-lb{display:block;height:6px}.mny-lb i{display:block;height:100%;border-radius:3px}.mny-c{display:grid;grid-template-columns:minmax(0,15em) minmax(0,1fr) 44px;gap:8px;align-items:center;font-size:12px;padding:2px 0;font-variant-numeric:tabular-nums}.mny-c>span:last-child{text-align:right}.mny-lb i.buy{background:var(--acc2)}.mny-lb i.in{background:var(--good)}.mny-lb i.out{background:var(--bad);opacity:.8}

@media(max-width:560px){.mny-tiles{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:6px}.mny-t{padding:6px 8px;font-size:11px}.mny-v{font-size:17px}.mny-l{grid-template-columns:52px minmax(0,1fr) 28px 58px;gap:6px}.mny-c{grid-template-columns:minmax(0,1fr) 60px 36px}}
.yourow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;padding:6px 0;border-top:1px solid var(--line)}
.yourow:first-of-type{border-top:0}

@media (max-width:760px){.youg{grid-template-columns:minmax(0,1fr)}.youmeter{grid-template-columns:8em minmax(0,1fr) 4.5em}}
@media (max-width:760px){.youg .lf-prof{flex-direction:column;align-items:flex-start}.youg .lf-prof-sk{grid-template-columns:minmax(0,1fr)}}

/* ---- a club's page: hierarchy, staff, past seasons, against the league (clubpage.js) ---- */
.cpnav{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;gap:4px;flex-wrap:wrap;padding:8px 0;margin:6px 0 4px;border-bottom:1px solid var(--line)}
.cpnav a{padding:4px 10px;border-radius:4px;background:var(--soft);color:var(--fg2);cursor:pointer}.cpnav a:hover{background:var(--line)}
.cpblk{margin-top:22px;scroll-margin-top:48px}.cpblk>h3 .dim{font-weight:400;font-size:13px;margin-left:6px}.cplede{margin:-2px 0 10px;max-width:780px}
#cp-top{scroll-margin-top:48px}.cpgap{margin-top:12px}.cpsub{margin:18px 0 4px}
.cp2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px}.cp4{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.tag.cpvac{background:var(--vac);border:1px solid var(--selbd);color:var(--fg2)}
/* the org chart: lines meet at each box's middle; a last level stacks down a rail */
.cporgwrap{overflow-x:auto;padding:14px 10px}
.cporg,.cporg ul{display:flex;justify-content:center;padding:18px 0 0;margin:0;position:relative;list-style:none}.cporg{padding-top:0}
.cporg li{position:relative;padding:18px 5px 0;display:flex;flex-direction:column;align-items:center}.cporg>li{padding-top:0}
.cporg li::before,.cporg li::after{content:'';position:absolute;top:0;width:50%;height:18px;border-top:1px solid var(--bd)}
.cporg li::before{right:50%}.cporg li::after{left:50%;border-left:1px solid var(--bd)}
.cporg li:only-child::before,.cporg li:only-child::after{display:none}.cporg li:only-child{padding-top:18px}.cporg>li:only-child{padding-top:0}
.cporg li:only-child>.cpn::before{content:'';position:absolute;top:-18px;left:50%;height:18px;border-left:1px solid var(--bd)}.cporg>li:only-child>.cpn::before{display:none}
.cporg li:first-child::before,.cporg li:last-child::after{border:0}.cporg li:last-child::before{border-right:1px solid var(--bd)}
.cporg ul::before{content:'';position:absolute;top:0;left:50%;height:18px;border-left:1px solid var(--bd)}
.cporg li.hasstack{align-items:stretch}.cporg li.hasstack>.cpn{max-width:none}
.cpstack{display:flex;flex-direction:column;gap:6px;padding:10px 0 0 30px;position:relative}
.cpstack::before{content:'';position:absolute;left:15px;top:0;bottom:0;border-left:1px solid var(--bd)}
.cpstack>.cpn{max-width:none}.cpstack>.cpn::before{content:'';position:absolute;left:-15px;top:50%;width:15px;border-top:1px solid var(--bd)}
.cpstack>.cpn:last-child::after{content:'';position:absolute;left:-17px;width:4px;top:calc(50% + 1px);bottom:-2px;background:var(--bg)}
.cpn{position:relative;border:1px solid var(--bd);background:var(--bg);padding:6px 9px;min-width:150px;max-width:200px;display:flex;gap:8px;align-items:center;text-align:left;line-height:1.3}
.cpn .r,.cpn .x{font-size:11.5px;color:var(--dim)}.cpn .face{flex:none}
.cpn.vac{background:var(--vac);border:1px dashed var(--selbd)}.cpn.grp{background:var(--alt)}
.cpf{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;border:1px dashed var(--selbd);color:var(--dim)}
/* staff */
.cpstaff tr.cpdept td{color:var(--dim);padding-top:12px;border-bottom:1px solid var(--bd)}.cpstaff tr.cpdept span{font-size:11px}.cpsd{padding:8px 4px 2px}
/* seasons */
.cpsac{padding-left:0;padding-right:0;width:22px}
.cpsa{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;vertical-align:middle}
.cpsa svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.cpsa.up{background:var(--goodbg);color:var(--good)}.cpsa.dn{background:var(--badbg);color:var(--bad)}.cpsa.ch{background:var(--vac);color:var(--stars)}
.cpbar{display:inline-block;height:7px;background:var(--faint);vertical-align:middle;margin-left:6px;border-radius:0 2px 2px 0}
.cphons{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:4px 12px}
.cphon{display:flex;gap:10px;align-items:flex-start;border-top:1px solid var(--line);padding:7px 0}.cphon .dim{font-size:12px}
.cphi{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--fg2)}
.cphi.gold{background:var(--vac);color:var(--stars)}.cphi.up{background:var(--goodbg);color:var(--good)}
.cphi svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cprec td{white-space:normal}
/* against the league */
.cplegend{display:flex;gap:14px;flex-wrap:wrap;color:var(--fg2);font-size:12px;margin:2px 0 8px}
.cplegend i{display:inline-block;vertical-align:middle;margin-right:5px}.cplegend i.dot{width:9px;height:9px;border-radius:50%}
.cplegend i.tick{width:0;height:10px;border-left:2px solid var(--fg2)}.cplegend i.ln{width:14px;border-top:2px solid}.cplegend i.ln.dash{border-top:2px dashed var(--dim)}
.cplegend i.band{width:14px;height:9px;background:var(--track)}
.cpstrips{display:grid;grid-template-columns:minmax(120px,170px) 1fr 80px;gap:0 12px;align-items:stretch}
.cplbl,.cpplot,.cprk{border-bottom:1px solid var(--soft);padding:7px 0}.cplbl small,.cprk small{display:block;color:var(--dim);font-size:11.5px}
.cpplot{display:flex;align-items:center}.cprk{text-align:right}
.cpsp{position:relative;width:100%;height:30px;margin:0 6px}.cpsp::before{content:'';position:absolute;left:0;right:0;top:15px;border-top:1px solid var(--line)}
.cpsp b{position:absolute;top:10px;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:var(--faint);box-shadow:0 0 0 1.5px var(--bg)}
.cpsp b:hover{background:var(--dim)}.cpsp b.me{top:8px;width:14px;height:14px;margin-left:-7px;background:#2a78d6;box-shadow:0 0 0 2px var(--bg);z-index:2}
.cpsp i{position:absolute;top:5px;height:20px;border-left:2px solid var(--fg2);margin-left:-1px}
.cprg td,.cprg th{text-align:center;min-width:40px;padding:4px 0}.cprg td{border:2px solid var(--bg)}.cprg td.l,.cprg th.l{text-align:left;padding-right:12px;min-width:0}
.cprgkey{display:flex;align-items:center;gap:5px;color:var(--dim);font-size:12px;margin-top:6px}.cprgkey span{width:20px;height:9px}
.cpblk h3,.cpblk h4,.cpblk th,.cpsub{font-weight:400}.cpstaff,.cpseasons{width:100%}.cprg{width:100%}
table.cpstaff,table.cpseasons,table.cprg{width:100%}#cp-past .chart{max-width:820px}
.cpsa.cptr{width:22px;height:22px}.cpsa.cptr svg{width:13px;height:13px}
.packinst{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}.packinst .dim{width:100%;font-size:12px}.packinst button.on{border-color:var(--acc)}

/* a board meeting (boardroom.js): no bold, and the agenda as papers on the table */
.brm-ans button{text-align:left;white-space:normal;line-height:1.4;padding:9px 12px;border-radius:10px;min-height:44px}
/* the Finances page (finances.js): plain weight throughout */
.fin,.fin *{font-weight:400!important}
.fin{display:grid;gap:12px;min-width:0}.fin>.filters{margin:0}.fin .tiles{margin:0}
.fin-card{background:var(--elev);border-radius:var(--rad);box-shadow:var(--shadow);padding:12px 14px;min-width:0;margin:0}
.fin-ch{display:flex;flex-wrap:wrap;gap:2px 12px;align-items:baseline;margin-bottom:8px}.fin-ch h3{margin:0;font-size:15px;color:var(--fg)}.fin-ch .dim{font-size:12px}
.fin-two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;min-width:0}.fin-stack{display:grid;gap:12px;align-content:start;min-width:0}
.fin .num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.fin-scr{overflow-x:auto;margin:0 -14px;padding:0 14px}

#main .fin-t th{font-size:12px;color:var(--dim);background:none;text-align:left;padding:4px 10px 5px 0;border:0;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:bottom;cursor:default}#main .fin-t th.num{text-align:right}.fin-t th.num{text-align:right}
.fin-t th a{color:inherit;cursor:pointer}.fin-t th a:hover,.fin-t th a.on{color:var(--fg)}.fin-t th a.on{box-shadow:inset 0 -2px var(--fg)}
#main .fin-t td{padding:5px 10px 5px 0;border:0;border-top:1px solid var(--line);text-align:left;vertical-align:middle;white-space:normal;background:none}#main .fin-t td.num{text-align:right;white-space:nowrap}#main .fin-t th:last-child,#main .fin-t td:last-child{padding-right:0}#main .fin-t tr:first-child td{border-top:0}#main .fin-t td.ind{padding-left:12px}#main .fin-t.wide td:first-child{white-space:nowrap}#main .fin-t tr.gr td{padding-top:12px;border-top:0;color:var(--dim);font-size:12px}#main .fin-t tr.tot td{border-top:1px solid var(--dim)}
.fin-t th:last-child,.fin-t td:last-child{padding-right:0}.fin-t tr:first-child td{border-top:0}.fin-t td.ind{padding-left:12px}.fin-t td.dt{white-space:nowrap;color:var(--dim);width:60px}
.fin-t tr.gr td{color:var(--dim);font-size:12px;padding-top:12px;border-top:0}.fin-t tr.sub td{color:var(--fg2)}.fin-t tr.tot td{border-top:1px solid var(--dim)}.fin-t tr.off td{color:var(--dim)}
.fin-who{display:flex;align-items:center;gap:7px;min-width:0}.fin-who small{display:block;font-size:12px;color:var(--dim)}.fin-slot{width:22px;flex:none}.fin-who svg.face{margin:0;flex:none}
.fin a.cl svg{vertical-align:-3px}
.fin-mini{display:inline-block;width:64px;height:6px;border-radius:3px;background:var(--track);overflow:hidden;vertical-align:middle;margin-left:6px}.fin-mini i{display:block;height:100%;background:var(--acc2);border-radius:0 3px 3px 0}
.fin-walk{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px 16px;align-items:center}.fin-walk hr{grid-column:1/-1;border:0;border-top:1px solid var(--line);margin:2px 0;width:100%}.fin-walk .fin-who{gap:9px}
.fin-note{margin:10px 0 0;padding:8px 10px;border-radius:6px;font-size:12.5px;background:var(--alt);color:var(--fg)}.fin-note.bad{background:var(--badbg);color:var(--fg)}
.fin-bh,.fin-br{display:grid;grid-template-columns:minmax(130px,1.1fr) minmax(90px,1.6fr) 78px 78px 90px 14px;gap:14px;align-items:center}
.fin-bh{font-size:12px;color:var(--dim);padding:0 0 6px;border-bottom:1px solid var(--line)}.fin-bi{border-bottom:1px solid var(--line)}.fin-bi:last-child{border-bottom:0}
a.fin-br{color:inherit;cursor:pointer;width:100%;padding:9px 0;min-height:46px;text-decoration:none}a.fin-br:hover{background:var(--alt);box-shadow:-14px 0 var(--alt),14px 0 var(--alt)}
.fin-br .nm small{display:block;font-size:12px;color:var(--dim)}.fin-br .left{font-size:15px}.fin-br .chev{color:var(--dim);transition:transform .15s}.fin-br[aria-expanded=true] .chev{transform:rotate(90deg)}.fin-br .lab{display:none}
.fin-bar{display:block;height:8px;border-radius:4px;background:var(--track);overflow:hidden}.fin-bar i{display:block;height:100%;background:var(--acc2);border-radius:0 4px 4px 0}.fin-bar i.warn{background:var(--warn)}.fin-bar i.bad{background:var(--bad)}
.fin-st{padding:0 0 12px}
.fin-pick{display:flex;flex-wrap:wrap;gap:6px}.fin-pick a{padding:5px 12px;border:1px solid var(--line);border-radius:6px;color:var(--fg2);cursor:pointer}.fin-pick a.on{background:var(--acc2);color:var(--elev);border-color:var(--acc2)}
.fin-chart{display:block;width:100%;height:auto;overflow:visible}.fin-chart text{font-size:11px;fill:var(--dim)}.fin-chart .g{stroke:var(--line)}.fin-chart .l{fill:none;stroke:var(--acc2);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}.fin-chart .l.d{stroke:var(--fg);stroke-dasharray:4 3}.fin-chart .h{fill:transparent}
.fin-leg{font-size:12px;margin-bottom:4px}.fin-leg span{margin-right:12px}.fin-leg i{display:inline-block;width:18px;vertical-align:middle;margin-right:4px;border-top:2px solid var(--acc2)}.fin-leg i.d{border-top:2px dashed var(--fg)}
@media(max-width:700px){
 .fin-bh{display:none}.fin-br{grid-template-columns:1fr auto 14px;grid-template-areas:"nm left ch" "bar bar bar" "uu uu uu";gap:6px 10px}
 .fin-br .nm{grid-area:nm}.fin-br .barw{grid-area:bar}.fin-br .left{grid-area:left}.fin-br .chev{grid-area:ch}.fin-br .giv{display:none}.fin-br .used{grid-area:uu;text-align:left;font-size:12px;color:var(--dim)}.fin-br .lab{display:inline}
 .fin-two{grid-template-columns:minmax(0,1fr)}table.fin-t.wide{min-width:640px}
}
/* the club's presentation at an interview (ivdeck.js) */
:root{--ivd-a:#2a78d6;--ivd-b:#eb6834}[data-theme=dark]{--ivd-b:#e4602a}
.ivd,.ivd *{font-weight:400!important}
/* the room and the deck side by side, as the interview's meetgrid */
.ivd-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.ivd-side{display:flex;flex-direction:column;gap:12px;min-width:0}.ivd-side>section{margin:0}
@media(max-width:900px){.ivd-grid{grid-template-columns:minmax(0,1fr)}}

/* a slide: the recruitment packet's header and footer, sized for reading on any screen */
.ivd-slide{border:1px solid var(--line);border-radius:8px;background:var(--bg);box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:520px}
.ivd-sh{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:18px 22px 0;padding-bottom:8px;border-bottom:2px solid var(--acc)}
.ivd-sh h4{margin:0;font-size:22px;line-height:1.15;letter-spacing:-.02em}
.ivd-sh span{color:var(--dim);font-size:12px;white-space:nowrap}
.ivd-sb{flex:1;padding:14px 22px;display:flex;flex-direction:column;gap:14px;min-width:0}
.ivd-sf{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 22px;padding:9px 0;border-top:1px solid var(--line);font-size:12px}
.ivd-sby{display:flex;align-items:center;gap:7px;min-width:0}.ivd-sby svg.face{flex:none}
.ivd-lead{font-size:15px;line-height:1.45;margin:0;max-width:62ch}
.ivd-note{font-size:12px;color:var(--dim);margin:0;line-height:1.4}
.ivd-h{font-size:12px;color:var(--dim);margin:0 0 5px}

.ivd-hero{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.ivd-hero>div{display:flex;flex-direction:column;gap:2px;min-width:0}
.ivd-hero .ivd-big{font-size:27px;line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.ivd-hero span{font-size:12.5px;line-height:1.3}
.ivd-hero .dim{font-size:11.5px}
.ivd-two{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:20px}
.ivd-two>*{min-width:0}

.ivd-t{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
.ivd-t,.ivd-t tr,.ivd-t th,.ivd-t td{border:0!important;background:none!important}
.ivd-t th{font-size:11.5px;color:var(--dim);text-align:right;padding:3px 6px;border-bottom:1px solid var(--line)!important;white-space:nowrap}
.ivd-t td{text-align:right;padding:4px 6px;border-bottom:1px solid var(--soft)!important;white-space:nowrap}
.ivd-t th:first-child,.ivd-t td:first-child,.ivd-t .l{text-align:left;padding-left:0}
.ivd-t td:last-child,.ivd-t th:last-child{padding-right:0}
.ivd-t tr.sum td{border-top:1px solid var(--line)!important;border-bottom:0!important}
.ivd-t td.wrap{white-space:normal;min-width:170px}
.ivd-scroll{overflow-x:auto;scrollbar-width:thin}

.ivd-list{display:flex;flex-direction:column;gap:7px;margin:0;padding:0;list-style:none;font-size:13px;line-height:1.4}
.ivd-list li{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px}
.ivd-list li>span:first-child{color:var(--dim)}

.ivd-chart{width:100%;height:auto;display:block}
.ivd-chart text{font-size:11px;fill:var(--dim)}
.ivd-chart .vl{fill:var(--fg)}
.ivd-key{display:flex;flex-wrap:wrap;gap:3px 14px;font-size:12px;color:var(--fg2);margin:0 0 3px}
.ivd-key i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}

/* against the league */
.ivd-rank{display:grid;grid-template-columns:minmax(110px,150px) minmax(0,1fr) 62px;gap:0 12px;align-items:center;font-size:13px}
.ivd-rank>*{padding:6px 0;border-bottom:1px solid var(--soft)}
.ivd-rank small{display:block;font-size:11px;color:var(--dim)}
.ivd-rail{position:relative;height:26px;display:flex;align-items:center}
.ivd-rail::before{content:"";position:absolute;left:0;right:0;height:2px;background:var(--line);border-radius:1px}
.ivd-rail::after{content:"";position:absolute;left:50%;width:1px;height:12px;background:var(--dim)}
.ivd-rail i{position:absolute;width:12px;height:12px;border-radius:50%;background:var(--ivd-a);box-shadow:0 0 0 2px var(--bg);margin-left:-6px;z-index:1}
.ivd-rk{text-align:right;font-variant-numeric:tabular-nums}

/* the deck's controls: always there, since a phone has no hover */
.ivd-ctl{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:10px 0 0}
.ivd-ctl button{min-height:40px;min-width:44px;display:inline-flex;align-items:center;justify-content:center;gap:5px}
.ivd .thumbs a{height:56px;background:var(--bg)}
.ivd .thumbs a b{display:inline}
.ivd .thumbs svg.face{float:right}
.ivd .thumbs a:focus-visible{outline:2px solid var(--acc)}

/* the room: what's being said about the slide, and asking about it */
.ivd-box{border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:12px;min-width:0}
.ivd-box h3{margin:0 0 8px;font-size:13px;color:var(--dim)}
.ivd-say{display:flex;gap:9px;align-items:flex-start;font-size:13px;line-height:1.45}
.ivd-say svg.face{flex:none}
.ivd-q{display:flex;flex-direction:column;gap:5px}
.ivd-q button{text-align:left;white-space:normal;line-height:1.35;padding:8px 10px;min-height:40px}
.ivd-log{display:flex;flex-direction:column;gap:9px;margin:0 0 10px;font-size:13px;line-height:1.45}
.ivd-log .you{color:var(--fg2);padding-left:10px;border-left:2px solid var(--line)}
.ivd-time{font-size:12px;color:var(--dim);margin-top:8px;display:flex;gap:5px;align-items:center}
.ivd-noted{display:flex;flex-direction:column;gap:6px;font-size:12.5px;line-height:1.4}

.ivd-ref{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--fg2);padding:3px 8px;border:1px solid var(--line);border-radius:999px;cursor:pointer;background:var(--bg);margin:0 5px 5px 0}
.ivd-ref:hover{border-color:var(--acc)}

/* the plan: where the money goes */
.ivd-plan{display:flex;flex-direction:column;gap:4px;font-size:13px}
.ivd-plan>div{display:grid;grid-template-columns:minmax(0,1fr) 40px 58px 40px;gap:6px;align-items:center;padding:3px 0}
.ivd-plan button{padding:0;min-height:36px;min-width:40px}
.ivd-plan .v{text-align:center;font-variant-numeric:tabular-nums}
.ivd-plan small{display:block;color:var(--dim);font-size:11.5px}
.ivd-left{display:flex;justify-content:space-between;padding-top:8px;border-top:1px solid var(--line);font-size:13px;font-variant-numeric:tabular-nums}


.ivd-two2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.ivd-two2>*{min-width:0}
.ivd-trends{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.ivd-trends>*{min-width:0}
.ivd-cap{margin:0;font-size:13.5px;line-height:1.45}
.ivd-dials{display:grid;grid-template-columns:minmax(96px,120px) minmax(0,1fr);gap:0 10px;align-items:center;font-size:12.5px}
.ivd-dials>div{padding:5px 0;border-bottom:1px solid var(--soft)}.ivd-dials small{display:block;color:var(--dim);font-size:11px}
.ivd-dial{position:relative;height:30px}
.ivd-dial::before{content:"";position:absolute;left:0;right:0;top:50%;height:2px;margin-top:-1px;background:var(--line);border-radius:1px}
.ivd-dial .r{position:absolute;top:50%;height:8px;margin-top:-4px;background:var(--bd);opacity:.5;border-radius:4px}
.ivd-dial .a{position:absolute;top:50%;width:1px;height:14px;margin-top:-7px;background:var(--dim)}
.ivd-dial i{position:absolute;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:var(--ivd-a);box-shadow:0 0 0 2px var(--bg)}
.ivd-want{display:flex;flex-direction:column;gap:10px;font-size:13px;line-height:1.4}.ivd-want>div{display:flex;gap:9px;align-items:flex-start}.ivd-want svg.face{flex:none}
@media(max-width:700px){

 .ivd-two2{grid-template-columns:minmax(0,1fr)}.ivd-trends{grid-template-columns:repeat(2,minmax(0,1fr))}
 .ivd-slide{min-height:0}
 .ivd-sh{margin:14px 14px 0;flex-direction:column;gap:2px}.ivd-sh h4{font-size:19px}
 .ivd-sb{padding:12px 14px}.ivd-sf{margin:0 14px;flex-direction:column;align-items:flex-start;gap:3px}

}

.mbody .mhead .dim{font-size:12.5px}.mdate{flex:none;white-space:nowrap}

.mfilt{align-items:flex-end}.mfilt>.pn,.mfilt>button{margin-bottom:7px}.mfilt>.pn{margin-left:auto;display:flex;align-items:center;gap:2px}.mfilt>.pn .cnt{color:var(--dim);font-size:12px;margin-right:6px}
.mfilt>.pn>a,.mfilt>.pn>a:not(.on):hover{display:inline-flex;align-items:center;padding:5px 7px;background:none;color:var(--fg2);border:0;cursor:pointer}.mfilt>.pn>a.off{color:var(--faint);pointer-events:none}

.ovmsp .chk{display:flex;align-items:center;gap:6px;padding:4px 6px;margin:0;border-radius:5px;font-size:13px;white-space:nowrap}.ovmsp .chk:hover{background:var(--soft)}.ovmsp .chk:first-child{border-bottom:1px solid var(--soft);border-radius:5px 5px 0 0;margin-bottom:3px;padding-bottom:6px}

.ovmany td.good{color:var(--good)}.ovmany tr.ovg td{color:var(--acc);font-size:12px;padding-top:10px;border-bottom:1px solid var(--rule);background:transparent}
.ovmany tr.k1 td.l{box-shadow:inset 3px 0 0 var(--good)}.ovmany tr.k2 td.l{box-shadow:inset 3px 0 0 var(--action)}

/* A player in a message: a card with who he is, five facts in equal columns, then his best and worst in matching rows. */
.mpage .att{border-top:0;padding-top:0;margin-top:14px}
.pcard2{display:block;margin:0;border:1px solid var(--bd);border-radius:10px;overflow:hidden;font-size:13px}
.pchead{display:flex;align-items:center;gap:12px;padding:12px 14px}.pcwho{flex:1;min-width:0;font-size:15px}.pcwho .dim{font-size:12.5px;margin-top:1px}.pchead button{flex:none}
.pcard2 .pcfacts{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;margin:0;border-top:1px solid var(--soft);border-bottom:1px solid var(--soft)}
.pcard2 .pcfacts>div{display:block;padding:9px 14px;min-width:0;border-left:1px solid var(--soft)}.pcard2 .pcfacts>div:first-child{border-left:0}
.pcard2 .pcfacts span{display:block;color:var(--dim);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pcard2 .pcfacts i{display:block;font-style:normal;font-size:15px;margin-bottom:1px;white-space:nowrap;font-variant-numeric:tabular-nums}
.pcard2 .pcbars{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 24px;padding:10px 14px 12px;font-size:12.5px}.pcard2 .pcbars>div>.dim{font-size:11.5px;margin:0 0 5px}
.pcard2 .pcr{display:grid;grid-template-columns:minmax(0,1fr) 42px 56px 24px;align-items:center;gap:8px;line-height:1.7}.pcard2 .pcr>span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard2 .pcv,.pcp{text-align:right;font-variant-numeric:tabular-nums}.pcm{display:block;height:5px;border-radius:3px;background:var(--track);overflow:hidden}.pcm i{display:block;height:100%;border-radius:3px}
.pcard2 .pcnote{margin:0;padding:9px 14px;border-top:1px solid var(--soft);border-left:0;font-size:13px}
@media(max-width:620px){.pcard2 .pcfacts{grid-template-columns:repeat(3,minmax(0,1fr))}.pcard2 .pcfacts>div:nth-child(4){border-left:0}.pcard2 .pcfacts>div:nth-child(n+4){border-top:1px solid var(--soft)}.pcard2 .pcbars{grid-template-columns:minmax(0,1fr);gap:8px}.pchead{flex-wrap:wrap}.pcwho{flex-basis:calc(100% - 56px)}.pchead button{margin-left:56px}}

/* The bottom menu: every tab the same height, an icon over its name, with the count on the corner of the icon. */
[data-navp=bottom] #nav a{position:relative;justify-content:center}
[data-navs=both][data-navp=bottom] #nav .nvi{width:16px;height:16px;font-size:16px}
[data-navs=both][data-navp=bottom] #nav .badge{position:absolute;top:2px;left:calc(50% + 7px);margin:0;min-width:14px;padding:0 4px;box-sizing:border-box;font-size:10px;line-height:14px;font-weight:400;text-align:center}

/* Open jobs: one list, a hairline between jobs, the club and its facts on the left and one small action on the right. */

/* Flat application chrome. Keep semantic colours, data marks and overlay depth. */
:root { --action: #1d9bf0; --action-fg: #fff; --action-ink: #0969aa; --link: #2265b5; --money: #15803d; --money-hov: #116b33; }
[data-theme=dark] { --action-ink: #60b8f5; --link: #7aa2ff; }

button, button.g, button.r, #actions button { border-radius: 4px; box-shadow: none; }
input, select, fieldset, .lf-seg, .you-card, .hairb, .lookb { border-radius: 4px; }
.mchips button, .bd-trait { border-radius: 3px; }
/* Primary progression only: secondary and destructive actions keep their semantics. */
#actions #bcont, .wz-foot button:not(.g):not(.lnkbtn) {
  background: var(--action); color: var(--action-fg); border-color: var(--action); box-shadow: none;
}
#actions #bcont:hover, .wz-foot button:not(.g):not(.lnkbtn):hover {
  background: var(--action); color: var(--action-fg);
}
/* Commitments (start the game, sign, make or pick an offer) are money green. */
button.lf-big:not(.g), .cta button:not(.g), .mchips button.mon {
  background: var(--money); color: #fff; border-color: var(--money); box-shadow: none;
}
button.lf-big:not(.g):hover, .cta button:not(.g):hover, .mchips button.mon:hover {
  background: var(--money-hov); color: #fff;
}
/* Icons draw at a 2px line, the menu's too. Its weight setting (Appearance) still wins. */
svg.ic *, nav svg.nvi * { stroke-width: 2px; }

button:focus-visible, a:focus-visible {
  outline: 2px solid var(--action-ink); outline-offset: 2px;
}

/* Checkboxes and radios use the system's own colour, the help toggles' too. */
.lf-tog input { accent-color: auto; }

/* Grades: black letters; an A is gold, like the stars. */
.grade { color: #000; }
.grade.gA { background: var(--stars); }
/* an E reads like the Injured tag: the bad wash, its border, the dark red letter (both themes, via tokens) */
:root .grade.gE { background: var(--badbg); color: var(--th); box-shadow: inset 0 0 0 1px var(--badbd); }

/* Levels (facilities): filled steps in the action blue on the track grey, so the count reads at a glance. */
.lvl { gap: 3px; }
.lvl i { background: var(--track); border-radius: 2px; box-shadow: inset 0 0 0 1px var(--line); }
.lvl i.on { background: var(--action); box-shadow: none; }

/* Rings end square, not rounded: the philosophy match dial. */
.phdial svg circle { stroke-linecap: square; }

/* Bars are square: tracks, fills, meters, gauges' bars, the loading bar and the board's ladder. */
.bar, .lf-bar, .lf-bar i, .lf-sk-bar, .lf-sk-bar i, .meter, .meter span, .gbar, .gbar i,
.spl-bar, .spl-bar i, .bd-ladder i, .bd-ladder i:first-child, .bd-ladder i:last-child { border-radius: 0; }

/* Destructive buttons keep their red edge; the label is plain text. */
button.r { color: var(--fg); }

/* A draw in results text is dim, not bold (the W/D/L badges, .res, keep their weight). */
.D:not(.res) { font-weight: 400; }

/* News kickers: the category colour carries them, not weight. */
.kicker { font-weight: 400; }

/* A locked term reads from its closed padlock, on the quiet selection grey, not a yellow and red alarm. */
.lk, .lk.on { border-color: transparent; }
.lk.on { background: var(--hd); color: var(--fg); }
.lk.on:hover { background: var(--soft); }

/* Local navigation: a strip of abutting boxes. The current one is white with dark text
   and opens onto the content below; the rest are grey with link-blue labels. */
.tabs2, .fbf, .lg-tabs { flex-wrap: wrap; gap: 0; border-bottom: 1px solid var(--bd); }
.tabs2 a, .fbf a, .pill2, .lg-tabs button {
  padding: 5px 10px; margin: 0 -1px -1px 0; border: 1px solid var(--bd); border-radius: 0;
  background: var(--alt); color: var(--link); box-shadow: none; font-size: 13px; font-weight: 400;
}
.tabs2 a.on, .fbf a.on, .pill2.on, .lg-tabs button.on {
  position: relative; background: var(--bg); color: var(--fg);
  border-color: var(--bd); border-bottom-color: var(--bg);
}
.tabs2 a:not(.on):hover, .fbf a:not(.on):hover, .pill2:not(.on):hover, .lg-tabs button:not(.on):hover {
  background: var(--soft); color: var(--link); text-decoration: none;
}
.tabs2 a:not(.on), .fbf a:not(.on), .pill2:not(.on), .lg-tabs button:not(.on) { color: var(--link); }
.lg-tabs button .dim { margin-left: 4px; }
.lg-tabs button.on .dim { color: var(--dim); opacity: 1; }
.lf-seg button.on { background: var(--hd); color: var(--fg); }
.club-i.on { background: var(--hd); box-shadow: none; font-weight: 700; }
.mi.on { background: var(--hd); }
.mi:hover { background: var(--soft); }

/* In-flow panels need separation, not floating-card shadows. */
.neg section, .mail, .box, .tile, .bcard, .budg, .gcard {
  border-radius: 4px; box-shadow: none;
}
.bd-hero { background: var(--card); border: 0; border-radius: 4px; }
#msg { border-radius: 4px; box-shadow: none; }

/* Reference-style data screens: a grey header band under a lighter column-group row,
   zebra rows, hairline rules, a grey hover and a yellow row you've picked. The zebra has no
   specificity, so zone colours, our own row and other cell backgrounds still win. */
#main table, .neg table, .mbody table { font-variant-numeric: tabular-nums; }
#main td, #main th, .neg td, .neg th, .mbody td, .mbody th {
  padding: 4px 6px; border-bottom-style: solid; line-height: 1.3;
}
#main th, .neg th, .mbody th { background: var(--hd); color: var(--fg); border-bottom: 1px solid var(--rule); }
#main tr.over th, .neg tr.over th, .mbody tr.over th {
  background: var(--bg); color: var(--fg2); font-weight: 700; font-size: 11px;
  border-bottom: 1px solid var(--bd);
}
:where(#main, .neg, .mbody) :where(tr:nth-child(even)) > td { background: var(--alt); }
#main tbody tr:hover td, #main tr.r:hover td,
.neg tbody tr:hover td, .mbody tbody tr:hover td { background: var(--soft); }
#main tr.sel td, .neg tr.sel td, .mbody tr.sel td { background: var(--sel); }
#main td a:hover, .neg td a:hover, .mbody td a:hover {
  text-decoration: underline; text-underline-offset: 2px;
}
#main h2, #main h3, .neg h3 { color: var(--fg); }
/* Section headings: bold, black, no rule under them */
#main section>h3, #main .sec h4 {
  padding-bottom: 4px; border-bottom: 0; font-size: 1.25em;
}
#main .box, #main .budg, #main .gcard, .neg section {
  background: var(--bg); border: 0;
  border-radius: 0; box-shadow: none;
}
#main .tile {
  background: transparent; border: 0;
  border-radius: 0; box-shadow: none;
}
#main .bcards .bcard {
  background: transparent; border: 1px solid transparent;
  border-bottom-color: var(--line); border-radius: 0; box-shadow: none;
}
#main .bcards .bcard.on {
  background: var(--hd); border-color: transparent; box-shadow: none;
}
#main .bcards .bcard:hover { background: var(--soft); }
.news div, .nitem, .mi { border-bottom-style: solid; }

/* Remove decorative header gradients, but keep the chosen club palette.
   Appearance overrides are injected after this sheet and still take priority. */
header, header:has(.navbar) { background: var(--h1); }
.navbar, [data-navp=left] #nav, [data-navp=right] #nav,
[data-navp=bottom] #nav { background: var(--m1); }
.navbar, header:has(.navbar),
[data-theme=dark] .navbar, [data-theme=dark] header:has(.navbar),
[data-theme=dark][data-navp=left] #nav, [data-theme=dark][data-navp=right] #nav,
[data-theme=light][data-menu=auto] .navbar,
[data-theme=light][data-hdr=green] header:has(.navbar) { box-shadow: none; }

/* The approved onboarding treatment. */
.wz-top { border-bottom: 1px solid var(--line); }
.wz-top>b, .wz-h h2 { color: var(--fg); }
.wz-steps button { border-radius: 0; box-shadow: none; }
.wz-steps li.done button { color: var(--fg2); }
.wz-steps li.on button { background: transparent; color: var(--action-ink); }
/* Career, appearance and job choices use the same quiet selection language. */
.lf-opt, .hairb, .lookb { border: 1px solid transparent; border-radius: 4px; }
.lf-opt.on, .hairb.on, .lookb.on {
  border: 1px solid transparent; background: var(--hd);
  box-shadow: none;
}
.lf-opt.on b, .hairb.on span, .lookb.on span { text-decoration: none; }
/* Colour carries selection and data, not decorative panel washes. */
.lf-opt .dim { font-weight: 400; }
.bonus { color: var(--good); }
.lf-bar i, .lf-sk-bar i { background: var(--action); }
.lf-sk-bar i.hi { background: var(--good); }
.lf-sk-bar i.lo { background: var(--warn); }
.rep-v b, .lf-sk-v { color: var(--action-ink); }
.lf-chip, .packbox, .club-list, .lf-brief { border-radius: 4px; box-shadow: none; }
/* Keep primary actions recognisable when they cannot yet be used. */
#actions #bcont:disabled { opacity: .45; cursor: not-allowed; }


/* the review page inside the game's own shell */
#main{max-width:1120px;font-size:14px;line-height:1.5}
#main section{border:1px solid var(--bd);background:var(--panel);border-radius:var(--rad);box-shadow:var(--shadow);padding:14px 20px 18px;margin:0 0 18px;overflow:visible;scroll-margin-top:12px}
#main h1{font-size:26px;letter-spacing:-.5px;margin:0 0 4px}#main h2{font-size:20px;letter-spacing:-.3px;margin:4px 0 10px}#main h3{font-size:14px;font-weight:400;color:var(--fg2);margin:18px 0 8px}
#main p,#main li{max-width:820px}#main ul{padding-left:20px}#main a{color:var(--link)}.meta{color:var(--dim)}
figure{margin:12px 0}figure img{max-width:100%;min-height:60px;height:auto;display:block;border:1px solid var(--bd);border-radius:8px;background:#fff}
figure.plain img{border:0;border-radius:0}figcaption{color:var(--dim);font-size:12.5px;margin-top:5px}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g4{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}.g4 img{max-height:160px;object-fit:contain;padding:8px}
.shots img.dk{display:none}#main.dark .shots img.lt{display:none}#main.dark .shots img.dk{display:block}
#main.rvonly .shots figure:not(.rv){display:none}#main.rvonly .shots:not(:has(figure.rv)){display:none}#main.rvonly h3:has(+ .shots:not(:has(figure.rv))){display:none}
.lf-seg.views,.lf-seg.modes{margin:6px 8px 6px 0;vertical-align:middle}
.q{background:var(--card);border-left:3px solid var(--accbg);padding:10px 14px;border-radius:6px;margin-top:14px}

.tags{display:flex;flex-wrap:wrap;gap:6px}.tags span{background:var(--card);border-radius:5px;padding:4px 10px;font-size:13px}
.nums{width:100%;border-collapse:collapse;font-size:13px;margin:8px 0}.nums th,.nums td{text-align:left;vertical-align:top;padding:7px 10px;border-bottom:1px solid var(--line)}.nums th{color:var(--dim);font-weight:400;background:var(--hd)}.nums td:last-child{white-space:nowrap}
.swatches div{display:flex;align-items:center;gap:6px;margin:6px 0}.swatches i{width:22px;height:22px;border-radius:4px;border:1px solid var(--bd)}
#lock form{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:22px;width:min(320px,90vw)}
#lock input[type=password],#lock input[type=email]{width:100%;box-sizing:border-box;font:inherit;font-size:14px;padding:9px 12px;border:1px solid var(--inbd);border-radius:7px;background:var(--panel);color:var(--fg)}
#lock .keep{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--dim)}#lock button{font-size:14px;padding:8px 22px}#err{color:var(--bad);min-height:1.4em;margin:6px 0 0}
.hm-sub{color:var(--dim);font-size:14px;margin:0}.lfoot{text-align:center;font-size:12.5px;color:var(--dim);padding:6px 0 30px}.lfoot a{color:var(--link)}
header .lf-logo{display:inline-block;width:26px;height:26px;vertical-align:-6px;margin-right:4px}
#nav a{cursor:pointer}#cur,#burger{display:none}
@media (max-width:760px){
 #main section{scroll-margin-top:70px}

 #cur{display:flex;align-items:center;gap:8px;flex:1;min-width:0;font-size:17px;color:var(--bandfg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

}#main h1,#main h2,#main b,#main strong,header b.t,.hm-word{font-weight:400}
#lock .keep input{width:auto;margin:0;flex:none}
@media (max-width:760px){.g2{grid-template-columns:1fr}
 .wrap{padding:6px 10px 20px}#main{font-size:15px}#main section{padding:12px 14px;border-radius:10px}#main h1{font-size:22px}#main h2{font-size:18px}
 #main ul{padding-left:18px}.nums{display:block;overflow-x:auto}.nums td,.nums td:last-child{white-space:normal;min-width:7em}

 figure img{border-radius:6px}}
