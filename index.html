<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Libero Football review</title><style>
:root{--bg:#f6f5f2;--fg:#1d1d1b;--mut:#6b6a66;--card:#fff;--line:#e2e0da;--acc:#0d5c34;--qbg:#eef5f0}
@media (prefers-color-scheme:dark){:root{--bg:#161615;--fg:#ecebe7;--mut:#9d9b95;--card:#20201e;--line:#34332f;--acc:#5fbf8a;--qbg:#1c2a22}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
b,strong,h1,h2,h3,th{font-weight:400}main{max-width:1000px;margin:0 auto;padding:32px 16px 80px}
h1{font-size:30px;line-height:1.2;margin:0 0 6px}h2{font-size:23px;margin:0 0 12px}h3{font-size:18px;margin:22px 0 8px;color:var(--mut)}
.meta{color:var(--mut);margin:0 0 16px}a{color:var(--acc)}nav ol{columns:2;padding-left:20px}
section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:22px;margin:22px 0;scroll-margin-top:16px}
figure{margin:14px 0}figure img{max-width:100%;min-height:60px;height:auto;display:block;border:1px solid var(--line);border-radius:6px;background:#fff}
figure.dark img{background:#111}figure.plain img{border:0;border-radius:0}
.nums{width:100%;border-collapse:collapse;font-size:15px;margin:8px 0}.nums th,.nums td{text-align:left;vertical-align:top;padding:8px 10px;border-bottom:1px solid var(--line)}.nums th{color:var(--mut)}.nums td:last-child{white-space:nowrap}
@media (max-width:640px){.nums td:last-child{white-space:normal}}figcaption{color:var(--mut);font-size:14px;margin-top:6px}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,1fr)}.g4{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.shots img.dk{display:none}main.dark .shots img.lt{display:none}main.dark .shots img.dk{display:block}
.modes{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;margin:8px 0}.modes button{font:inherit;padding:6px 16px;border:0;background:var(--card);color:var(--fg);cursor:pointer}.modes button.on{background:var(--acc);color:#fff}
.g4 img{max-height:160px;object-fit:contain;padding:8px}
.wip{background:var(--qbg);border:1px solid var(--line);border-radius:6px;padding:10px 14px;margin:0 0 14px;color:var(--fg)}
.q{background:var(--qbg);border-left:3px solid var(--acc);padding:12px 14px;border-radius:4px;margin-top:16px}
.tags{display:flex;flex-wrap:wrap;gap:8px}.tags span{border:1px solid var(--line);border-radius:20px;padding:3px 12px;font-size:14px}
.swatches div{display:flex;align-items:center;gap:6px;margin:6px 0;font-size:15px}.swatches i{width:26px;height:26px;border-radius:4px;border:1px solid var(--line);display:inline-block}
#lock{max-width:360px;margin:18vh auto;padding:0 16px;text-align:center}#lock input{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--fg);margin:14px 0 10px}
#lock button{font:inherit;padding:9px 20px;border:0;border-radius:6px;background:var(--acc);color:#fff;cursor:pointer}#err{color:#c0392b;min-height:1.5em}
@media (max-width:640px){.g2{grid-template-columns:1fr}nav ol{columns:1}section{padding:16px}}
</style></head><body>

async function open(p){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(D.s),iterations:D.n,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt']);
 const t=await crypto.subtle.decrypt({name:'AES-GCM',iv:u(D.i)},key,u(D.c));
 const m=document.getElementById('doc');m.innerHTML=new TextDecoder().decode(t);m.hidden=false;document.getElementById('lock').remove();
 const imgs=[...m.querySelectorAll('img[data-enc]')],load=async im=>{const b=new Uint8Array(await (await fetch(im.dataset.enc)).arrayBuffer());
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b.slice(0,12)},key,b.slice(12));im.src=URL.createObjectURL(new Blob([pt],{type:im.dataset.type}));im.style.cursor='zoom-in';im.onclick=()=>window.open(im.src)};
 const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){io.unobserve(e.target);load(e.target)}}),{rootMargin:'800px'});imgs.forEach(i=>io.observe(i));
 m.querySelectorAll('.modes button').forEach(b=>b.onclick=()=>{m.classList.toggle('dark',b.dataset.m=='dk');m.querySelectorAll('.modes button').forEach(x=>x.classList.toggle('on',x==b))});
 if(location.hash){const e=document.querySelector(location.hash);e&&e.scrollIntoView()}}
document.getElementById('f').onsubmit=async e=>{e.preventDefault();const er=document.getElementById('err');er.textContent='Opening…';
